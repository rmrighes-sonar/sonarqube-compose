name: CI

# One workflow, one visible pipeline graph:
#
#   version -> build -> test -> sonarqube -> release
#
# `version` computes the next semantic version (from Conventional Commits
# since the last tag, via semantic-release --dry-run) and runs first,
# sequentially before build -- deliberate, not a data dependency (build
# doesn't consume version's output): the version for a commit should be
# settled before anything else about that commit is validated.
#
# `sonarqube` needs version's *output*, but GitHub Actions only grants
# output access to jobs listed directly in `needs:` -- listing `version`
# there alongside `test` would draw a second, direct version -> sonarqube
# edge on the Actions graph in addition to the version -> build -> test
# chain, which looks exactly like the redundant-edge mistake caught and
# fixed on `publish` in the sibling sonarqube-prometheus-exporter repo
# (hovering `version` would visually "skip" build/test straight to
# sonarqube). Avoided here by threading the value through each
# intermediate job's own `outputs:` instead (build re-exposes
# needs.version.outputs.version as its own output, test re-exposes
# build's) -- sonarqube then only needs `test`, and the graph stays a
# genuinely clean, single-edge-per-job straight line.
#
# `release` only runs the real (non-dry-run) semantic-release on a `push`
# to `main`, after `sonarqube` passes -- see README.md's "Releases" section
# for why every merge to main now gets its own tagged release, and why this
# replaced release-please's PR-batching model.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  version:
    # Preview-only: computes the next version without tagging/releasing
    # anything. Runs on every push and PR so sonarqube always has a
    # forward-looking version to stamp, not just on release-worthy pushes
    # -- but only the `push` path actually needs semantic-release itself.
    # On `pull_request`, semantic-release's branch-matching check can never
    # pass anyway (it reads GITHUB_REF directly, which is always the
    # detached synthetic merge ref there, confirmed by testing -- see
    # README.md's "Releases" section), and an approximate version doesn't
    # affect correctness for PR analyses (SonarQube defines PR "new code"
    # as diff-vs-target-branch, not by version). So PRs skip Node/npm/
    # semantic-release entirely via step-level `if:` and just read the
    # latest tag with plain git -- no point spinning up a whole JS
    # toolchain for a value that's discarded before use.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version || steps.fallback.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semantic-release needs full tag history; git describe does too

      - name: Use latest tag (pull_request only)
        id: fallback
        if: github.event_name != 'push'
        run: |
          set -euo pipefail
          TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        if: github.event_name == 'push'
        with:
          node-version: 22

      - name: Install semantic-release
        if: github.event_name == 'push'
        # No package.json in this repo -- semantic-release runs fine
        # without one (see .releaserc.json for its config), so these are
        # installed ephemerally per-run rather than committing a Node
        # toolchain into an otherwise Node-free repo. Exact-pinned
        # (no ^/~ range) and --ignore-scripts: unpinned + script-executing
        # installs of third-party packages both flagged by SonarQube
        # (githubactions:S8543, S6505) as supply-chain risks.
        run: npm install --no-save --ignore-scripts semantic-release@25.0.9 conventional-changelog-conventionalcommits@10.4.0

      - name: Compute next version (dry run, no tag/release created)
        # Writes to $GITHUB_OUTPUT itself (see the script) rather than via
        # shell redirection -- semantic-release's own logger writes
        # non-key=value progress lines straight to stdout, which would
        # otherwise corrupt $GITHUB_OUTPUT if this whole command's output
        # were naively piped into it.
        id: version
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/semantic-release/print-next-version.mjs

  build:
    needs: version
    # Re-exposes version's output as its own so `test` (and transitively
    # `sonarqube`) can reach it via a single-hop `needs:` chain instead of
    # reaching directly back to `version` -- see the header note above.
    outputs:
      version: ${{ needs.version.outputs.version }}
    # Fast, cheap validation that the tracked config is well-formed --
    # fails in seconds instead of waiting on the (much slower) smoke test.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Create dummy .env for config validation
        # .env.example's placeholder values are non-secret and non-empty --
        # exactly what `docker compose config` needs to resolve every
        # ${VAR} reference across all profile combinations without
        # warnings. Never a real secret, and never committed.
        run: cp .env.example .env

      - name: Validate compose config (base + every profile combination)
        run: |
          set -euo pipefail
          for profiles in \
            "" \
            "--profile monitoring" \
            "--profile share" \
            "--profile mcp" \
            "--profile monitoring --profile share --profile mcp"; do
            echo "== docker compose ${profiles:-<none>} config -q =="
            # shellcheck disable=SC2086
            docker compose ${profiles} config -q
          done

      - name: Shellcheck
        run: shellcheck scripts/*.sh

      - name: Validate dashboard JSON
        run: |
          set -euo pipefail
          for f in grafana/dashboards/*.json; do
            echo "== $f =="
            jq empty "$f"
          done

  test:
    needs: build
    # Re-exposes build's (pass-through of version's) output the same way,
    # one more hop down the chain -- see the header note above.
    outputs:
      version: ${{ needs.build.outputs.version }}
    # Smoke test: prove the stack this repo ships actually comes up
    # healthy, not just that its YAML parses. Limited to the profiles that
    # don't need a real external secret (`share` needs a real
    # NGROK_AUTHTOKEN; `mcp` adds limited value here) -- core + monitoring
    # already exercises Postgres, SonarQube, Prometheus, Grafana, the
    # exporter, and blackbox-exporter end to end.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Create dummy .env for smoke test
        run: cp .env.example .env

      - name: Raise vm.max_map_count for embedded Elasticsearch
        # SonarQube's bundled Elasticsearch fails its bootstrap checks
        # below this -- see the "Prerequisites" section of README.md.
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Start core + monitoring profile
        run: docker compose --profile monitoring up -d --wait --wait-timeout 240

      - name: Show container status
        if: always()
        run: docker compose ps

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v

  sonarqube:
    needs: test
    # Requires SONAR_TOKEN (secret) and SONAR_HOST_URL (variable) to be
    # set, and the SonarQube server (this repo's own compose stack,
    # tunnelled via ngrok) to be reachable from GitHub-hosted runners at
    # scan time -- see the "GitHub Integration" section of README.md.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # disable shallow clone for better analysis relevancy

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7.1.0
        with:
          args: >
            -Dsonar.projectVersion=${{ needs.test.outputs.version }}
          # The action defaults to true (skipping GPG verification of the
          # downloaded Sonar Scanner CLI binary, only checksum-verifying
          # it) -- opt in to full signature verification instead.
          skipSignatureVerification: false
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  release:
    needs: sonarqube
    # Only cut a real release from main, and only once the quality gate has
    # passed. `success()` is required explicitly because this if: replaces
    # (doesn't add to) the default implicit success()-on-needs check.
    if: github.event_name == 'push' && success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install semantic-release
        run: npm install --no-save --ignore-scripts semantic-release@25.0.9 conventional-changelog-conventionalcommits@10.4.0

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Invoke the just-installed local binary directly rather than
        # `npx semantic-release` -- SonarQube flags npx (githubactions:S6505)
        # since it can transparently install and run an arbitrary package's
        # lifecycle scripts on demand if one isn't already present locally.
        # It never would be here in practice (installed in the previous
        # step, same job), but the direct path makes that guarantee
        # explicit instead of implicit.
        run: ./node_modules/.bin/semantic-release
