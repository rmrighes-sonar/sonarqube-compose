name: CI

# One workflow, one visible pipeline graph:
#
#   version -> lint -> smoke-test -> sonarqube -> release
#
# `version` computes the next semantic version (from Conventional Commits
# since the last tag, via semantic-release --dry-run) and runs first,
# sequentially before lint -- deliberate, not a data dependency (lint
# doesn't consume version's output): the version for a commit should be
# settled before anything else about that commit is validated. It only
# exists on `push` -- see that job for why -- and `lint` explicitly
# tolerates it being skipped so pull_request runs still get validated.
#
# `sonarqube` needs version's *output*, but GitHub Actions only grants
# output access to jobs listed directly in `needs:` -- listing `version`
# there alongside `smoke-test` would draw a second, direct
# version -> sonarqube edge on the Actions graph in addition to the
# version -> lint -> smoke-test chain, which looks exactly like the
# redundant-edge mistake caught and fixed on `publish` in the sibling
# sonarqube-prometheus-exporter repo (hovering `version` would visually
# "skip" lint/smoke-test straight to sonarqube). Avoided here by threading
# the value through each intermediate job's own `outputs:` instead (lint
# re-exposes needs.version.outputs.version as its own output, smoke-test
# re-exposes lint's) -- sonarqube then only needs `smoke-test`, and the
# graph stays a genuinely clean, single-edge-per-job straight line.
# sonarqube also supplies its own plain-git fallback for pull_request runs,
# where the threaded value is empty because version never ran at all.
#
# `release` only runs the real (non-dry-run) semantic-release on a `push`
# to `main`, after `sonarqube` passes -- see README.md's "Releases" section
# for why every merge to main now gets its own tagged release, and why this
# replaced release-please's PR-batching model.
#
# `lint` and `smoke-test` (previously named `build`/`test`) were renamed to
# reflect what they actually do: `lint` only statically validates the
# tracked config (compose config resolution, shellcheck, JSON parsing) --
# it builds no artifact, unlike the sibling sonarqube-prometheus-exporter
# repo's `build` job, which really does compile Go binaries. `smoke-test`
# is specifically a runtime integration/smoke test (spins up the real
# stack, waits on healthchecks), not a unit test. Job IDs with a hyphen
# (`smoke-test`) need bracket syntax in expressions --
# `needs['smoke-test'].outputs.version`, not dot notation, since `-` would
# otherwise parse as subtraction.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  version:
    # Only exists on `push`: semantic-release's branch-matching check reads
    # GitHub's own GITHUB_REF directly and can never pass on a
    # `pull_request`'s detached synthetic merge ref regardless of
    # dryRun/ci options (confirmed by testing), and an approximate version
    # doesn't affect correctness there anyway -- SonarQube's PR-analysis
    # mode defines "new code" as diff-vs-target-branch, not by version. A
    # job-level `if:` here (rather than per-step) means PR runs mark this
    # `skipped` without ever starting a runner -- zero cost, not just
    # cheap -- instead of paying for a checkout + shell step just to
    # discard the result. `sonarqube` supplies its own plain-git fallback
    # for PR runs where this job never ran at all (see that job below).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      # contents: write, not just read -- confirmed by testing: even with
      # dryRun: true, semantic-release's core verification phase performs
      # an actual git-push permission check (not merely a read-only
      # preview), and fails outright ("Cannot push to the Git repository",
      # EGITNOPERMISSION) without write access, despite never actually
      # creating anything.
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semantic-release needs full tag history

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install semantic-release
        # No package.json in this repo -- semantic-release runs fine
        # without one (see .releaserc.json for its config), so it's
        # installed ephemerally per-run rather than committing a Node
        # toolchain into an otherwise Node-free repo. Exact-pinned
        # (no ^/~ range) and --ignore-scripts: unpinned + script-executing
        # installs of third-party packages both flagged by SonarQube
        # (githubactions:S8543, S6505) as supply-chain risks.
        #
        # No conventional-changelog-conventionalcommits here (an earlier
        # version of this workflow installed it for a custom "preset") --
        # confirmed by testing that @semantic-release/release-notes-generator
        # bundles its own nested, older conventional-changelog-writer that
        # can't be overridden by installing a newer one at the top level
        # (npm won't substitute a version outside a package's own declared
        # range into that package's private resolution), so
        # conventionalcommits@10.x's writer@9+ requirement could never be
        # satisfied that way. .releaserc.json now uses semantic-release's
        # bundled default ("angular") preset instead -- no extra package,
        # no version conflicts, and it already recognizes standard
        # Conventional Commits syntax; the custom releaseRules there
        # override the type-to-bump mapping regardless of preset.
        run: npm install --no-save --ignore-scripts semantic-release@25.0.9

      - name: Compute next version (dry run, no tag/release created)
        # Writes to $GITHUB_OUTPUT itself (see the script) rather than via
        # shell redirection -- semantic-release's own logger writes
        # non-key=value progress lines straight to stdout, which would
        # otherwise corrupt $GITHUB_OUTPUT if this whole command's output
        # were naively piped into it.
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/semantic-release/print-next-version.mjs

  lint:
    needs: version
    # version is *legitimately* skipped on pull_request (see above), which
    # would otherwise cascade-skip lint/smoke-test/sonarqube too by default
    # (needs: requires success(), and skipped != success) -- explicitly
    # tolerate that here so PRs still actually get validated. A genuine
    # failure in version (only possible on push) still correctly blocks
    # everything downstream.
    if: always() && (needs.version.result == 'success' || needs.version.result == 'skipped')
    # Re-exposes version's output as its own so `smoke-test` (and
    # transitively `sonarqube`) can reach it via a single-hop `needs:`
    # chain instead of reaching directly back to `version` -- see the
    # header note above. Empty on PR runs (version didn't run) --
    # sonarqube supplies its own fallback for that case.
    outputs:
      version: ${{ needs.version.outputs.version }}
    # Fast, cheap static validation that the tracked config is
    # well-formed -- fails in seconds instead of waiting on the (much
    # slower) smoke test. Builds no artifact (unlike the sibling
    # sonarqube-prometheus-exporter repo's `build` job, which compiles Go
    # binaries) -- this is purely config/script/JSON linting.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Create dummy .env for config validation
        # .env.example's placeholder values are non-secret and non-empty --
        # exactly what `docker compose config` needs to resolve every
        # ${VAR} reference across all profile combinations without
        # warnings. Never a real secret, and never committed.
        run: cp .env.example .env

      - name: Validate compose config (base + every profile combination)
        run: |
          set -euo pipefail
          for profiles in \
            "" \
            "--profile monitoring" \
            "--profile share" \
            "--profile mcp" \
            "--profile monitoring --profile share --profile mcp"; do
            echo "== docker compose ${profiles:-<none>} config -q =="
            # shellcheck disable=SC2086
            docker compose ${profiles} config -q
          done

      - name: Shellcheck
        run: shellcheck scripts/*.sh

      - name: Validate JSON configs
        # Includes .releaserc.json -- it's only ever read by the version/
        # release jobs, and version doesn't even run on pull_request (see
        # that job's if:), so a broken .releaserc.json would otherwise
        # sail through an entire PR unnoticed and only blow up for the
        # first time on the real push to main that finally invokes it,
        # breaking `release` in production.
        run: |
          set -euo pipefail
          for f in grafana/dashboards/*.json .releaserc.json; do
            echo "== $f =="
            jq empty "$f"
          done

      - name: Validate YAML configs
        # yq is preinstalled on GitHub-hosted ubuntu-latest runners.
        # prometheus/prometheus.yml is deliberately not included here --
        # the next step validates it more thoroughly with promtool, which
        # also catches semantic errors (bad scrape/relabel configs) that
        # plain YAML parsing can't.
        run: |
          set -euo pipefail
          for f in \
            grafana/provisioning/dashboards/sonarqube.yaml \
            grafana/provisioning/datasources/prometheus.yaml \
            prometheus/blackbox.yml; do
            echo "== $f =="
            yq eval . "$f" > /dev/null
          done

      - name: Validate prometheus.yml with promtool
        # promtool (bundled in the same image the monitoring profile
        # actually runs) checks scrape configs, relabeling rules, etc.
        # semantically -- not just YAML syntax. A malformed scrape job can
        # otherwise fail silently (Prometheus just skips it) rather than
        # erroring loudly, so smoke-test's healthcheck alone wouldn't
        # catch it. promtool also verifies referenced credential files
        # exist, so the sonarqube job's credentials_file needs a stand-in
        # for the real Docker secret compose.yaml mounts at runtime --
        # content is never read for a config-syntax check, just presence.
        run: |
          set -euo pipefail
          mkdir -p /tmp/fake-secrets
          echo dummy > /tmp/fake-secrets/sonar_system_passcode
          docker run --rm --entrypoint promtool \
            -v "$(pwd)/prometheus:/etc/prometheus:ro" \
            -v /tmp/fake-secrets/sonar_system_passcode:/run/secrets/sonar_system_passcode:ro \
            prom/prometheus:latest \
            check config /etc/prometheus/prometheus.yml

      - name: Check .env.example matches variables referenced in compose.yaml
        # Catches drift in both directions: a new ${VAR} added to
        # compose.yaml but forgotten in .env.example (breaks the README's
        # setup instructions silently), or a stale entry left in
        # .env.example for a variable compose.yaml no longer references.
        run: |
          set -euo pipefail
          COMPOSE_VARS="$(grep -ohE '\$\{[A-Z_][A-Z0-9_]*\}' compose.yaml | sed -E 's/^\$\{(.*)\}$/\1/' | sort -u)"
          ENV_VARS="$(grep -ohE '^[A-Z_][A-Z0-9_]*=' .env.example | sed 's/=$//' | sort -u)"
          MISSING_IN_ENV="$(comm -23 <(echo "$COMPOSE_VARS") <(echo "$ENV_VARS"))"
          MISSING_IN_COMPOSE="$(comm -13 <(echo "$COMPOSE_VARS") <(echo "$ENV_VARS"))"
          STATUS=0
          if [ -n "$MISSING_IN_ENV" ]; then
            echo "Referenced in compose.yaml but missing from .env.example:"
            echo "$MISSING_IN_ENV"
            STATUS=1
          fi
          if [ -n "$MISSING_IN_COMPOSE" ]; then
            echo "Documented in .env.example but never referenced in compose.yaml:"
            echo "$MISSING_IN_COMPOSE"
            STATUS=1
          fi
          exit "$STATUS"

      - name: Install actionlint
        # Downloads a pinned release + verifies its checksum, rather than
        # curl-pipe-to-bash or an unpinned third-party Action -- consistent
        # with this workflow's other exact-pinned, --ignore-scripts-style
        # supply-chain hygiene (see the `version`/`release` jobs' npm
        # installs).
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          set -euo pipefail
          curl -sSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          tar xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint

      - name: Lint GitHub Actions workflows
        # Not part of this pipeline until now -- every real bug this
        # exact tool caught during development (invalid expressions,
        # deprecated action versions, syntax mistakes) had to be run
        # manually and remembered; this makes that automatic on every
        # push/PR instead.
        run: ./actionlint -color

  smoke-test:
    needs: lint
    # always() && is required, not decorative: GitHub skips *evaluating* a
    # job's if: entirely (short-circuiting straight to "skipped") whenever
    # any ancestor was skipped, unless the condition contains always(),
    # success(), failure(), or cancelled() -- confirmed by testing (a bare
    # `needs.lint.result == 'success'` here still cascaded to "skipped"
    # even though lint had actually succeeded, because version -- an
    # ancestor via lint -- is legitimately skipped on every pull_request).
    # always() forces evaluation; the && condition then does the real
    # check, restricted to lint's own result rather than the default
    # implicit success(), which checks the *entire* transitive ancestor
    # chain rather than just this job's direct needs:.
    if: always() && needs.lint.result == 'success'
    # Re-exposes lint's (pass-through of version's) output the same way,
    # one more hop down the chain -- see the header note above.
    outputs:
      version: ${{ needs.lint.outputs.version }}
    # Prove the stack this repo ships actually comes up healthy, not just
    # that its YAML parses -- a real runtime integration test, distinct
    # from lint's static-only checks. Limited to the profiles that don't
    # need a real external secret (`share` needs a real NGROK_AUTHTOKEN;
    # `mcp` adds limited value here) -- core + monitoring already
    # exercises Postgres, SonarQube, Prometheus, Grafana, the exporter,
    # and blackbox-exporter end to end.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Create dummy .env for smoke test
        run: cp .env.example .env

      - name: Raise vm.max_map_count for embedded Elasticsearch
        # SonarQube's bundled Elasticsearch fails its bootstrap checks
        # below this -- see the "Prerequisites" section of README.md.
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Start core + monitoring profile
        run: docker compose --profile monitoring up -d --wait --wait-timeout 240

      - name: Show container status
        if: always()
        run: docker compose ps

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v

  sonarqube:
    needs: smoke-test
    # Same reasoning as smoke-test's if: above -- always() forces
    # evaluation despite version's skip further up the chain; the &&
    # condition restricts to smoke-test's own result. Bracket syntax
    # (needs['smoke-test']) is required, not stylistic, since dot notation
    # (needs.smoke-test) would parse the hyphen as subtraction.
    if: always() && needs['smoke-test'].result == 'success'
    # Requires SONAR_TOKEN (secret) and SONAR_HOST_URL (variable) to be
    # set, and the SonarQube server (this repo's own compose stack,
    # tunnelled via ngrok) to be reachable from GitHub-hosted runners at
    # scan time -- see the "GitHub Integration" section of README.md.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # disable shallow clone for better analysis relevancy

      - name: Resolve version (falls back to latest tag on pull_request, where the version job never runs)
        id: resolved_version
        run: |
          set -euo pipefail
          V="${{ needs['smoke-test'].outputs.version }}"
          if [ -z "$V" ]; then
            TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)"
            V="${TAG#v}"
          fi
          echo "value=$V" >> "$GITHUB_OUTPUT"

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7.1.0
        with:
          args: >
            -Dsonar.projectVersion=${{ steps.resolved_version.outputs.value }}
          # The action defaults to true (skipping GPG verification of the
          # downloaded Sonar Scanner CLI binary, only checksum-verifying
          # it) -- opt in to full signature verification instead.
          skipSignatureVerification: false
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  release:
    needs: sonarqube
    # Only cut a real release from main, and only once the quality gate has
    # passed. always() forces if: evaluation despite version's skip
    # further up the chain on pull_request runs (moot for release itself,
    # since it's already push-gated below, but needed for consistency --
    # without it this job would show "skipped" on every push too, for the
    # same short-circuiting reason as smoke-test/sonarqube above).
    if: always() && github.event_name == 'push' && needs.sonarqube.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install semantic-release
        # See the matching note in the `version` job above -- no
        # conventional-changelog-conventionalcommits, default "angular"
        # preset instead.
        run: npm install --no-save --ignore-scripts semantic-release@25.0.9

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Invoke the just-installed local binary directly rather than
        # `npx semantic-release` -- SonarQube flags npx (githubactions:S6505)
        # since it can transparently install and run an arbitrary package's
        # lifecycle scripts on demand if one isn't already present locally.
        # It never would be here in practice (installed in the previous
        # step, same job), but the direct path makes that guarantee
        # explicit instead of implicit.
        run: ./node_modules/.bin/semantic-release
