name: release-please

on:
  push:
    branches: [main]

jobs:
  release-please:
    # Maintains a standing "Release PR" summarizing every Conventional
    # Commit merged to main since the last release; merging that PR is what
    # actually cuts the tag + GitHub Release (see release-please-config.json
    # / .release-please-manifest.json). Ordinary commits to main just update
    # the pending PR. This repo has no build/publish artifact of its own
    # (unlike sonarqube-prometheus-exporter), so a release here is just a version
    # marker + changelog for the stack's config/docs/scripts.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Without this, the PR is authored by github-actions[bot] (via the
          # default GITHUB_TOKEN below), which GitHub now gates behind manual
          # approval on every release ("Bot-created pull requests can run
          # workflows if approved", 2026-06-11) -- even for same-repo, non-fork
          # branches. Add a repo secret RELEASE_PLEASE_TOKEN (fine-grained PAT
          # scoped to this repo with Contents: read/write + Pull requests:
          # read/write, or a GitHub App installation token) to have the PR
          # authored by a trusted identity instead, removing the approval gate.
          # Falls back to GITHUB_TOKEN (today's behavior) until that secret exists.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
