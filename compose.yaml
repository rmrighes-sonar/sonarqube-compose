name: sonarqube-local

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 256m
    restart: unless-stopped

  sonarqube:
    image: ${SONARQUBE_IMAGE}
    depends_on:
      db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SONAR_JDBC_USERNAME: ${POSTGRES_USER}
      SONAR_JDBC_PASSWORD: ${POSTGRES_PASSWORD}
      SONAR_WEB_SYSTEMPASSCODE: ${SONAR_SYSTEM_PASSCODE}
      # Wires SonarQube's hosted MCP proxy (Administration > System Info >
      # System > MCP) to the `mcp` service below. Harmless when the `mcp`
      # profile isn't running -- just shows Enabled: true, Healthy: false,
      # same as before this was set.
      SONAR_MCP_ENABLED: "true"
      SONAR_MCP_SERVERURL: "http://mcp:8080"
      # Off by default since SonarQube's SONAR-27755 (2026-06-01) -- without
      # this, the WebApiV1/V2/MyBatis metrics interceptors never fire, so
      # sonarqube_web_api_v1/v2_request_duration_seconds and
      # sonarqube_db_query_duration_seconds stay permanently empty (0
      # samples) regardless of traffic, breaking the "Web & API performance"
      # and "DB query rate/latency" panels in the Grafana Health dashboard.
      SONAR_PERFORMANCEMONITORING_ENABLED: "true"
      # JVM heap tuning for the 3 processes SonarQube runs inside this
      # container (Web, Compute Engine, embedded Elasticsearch/"search").
      # These *_JAVAOPTS vars fully REPLACE that process's default JVM
      # options (unlike *_JAVAADDITIONALOPTS, which appends and therefore
      # can't override -Xmx -- the default wins if duplicated), so each
      # value below is a complete option string, not a delta.
      #
      # This image's un-tuned defaults (see /opt/sonarqube/conf/sonar.properties
      # in the running container) are sized for general-purpose instances:
      # web -Xmx1G, ce -Xmx2G, search -Xmx2G + 1G direct memory --
      # i.e. up to ~6G of declared JVM memory across the 3 processes, against
      # this service's 4g `deploy.resources.limits.memory` below. That gap is
      # normally masked by low, bursty local demo traffic (one project, one
      # analysis at a time), but is a latent OOM-kill risk under any real
      # concurrent load, since Docker enforces the container limit as a hard
      # cap regardless of what the JVMs think they're allowed to use.
      #
      # Right-sized instead for this stack's actual profile (single/few
      # small local projects, one analysis at a time, one interactive user):
      # declared max is Web 512m + CE 1G + Search 768m heap/768m off-heap +
      # 256m direct memory = 2.56G, leaving ~1.5G of the 4g limit for
      # per-process JVM overhead (metaspace, thread stacks, JIT code cache)
      # -- comfortable margin instead of a hard cap that's smaller than the
      # JVMs' own ceiling. -Xms is set low for Web/CE (idle between
      # requests/analyses, no benefit to pre-reserving) but must equal -Xmx
      # for Search (Elasticsearch requirement, unchanged from the default).
      #
      # -XX:+ExitOnOutOfMemoryError (added, not in the defaults) fails a
      # process fast on real OOM instead of limping on in a degraded state;
      # -XX:HeapDumpPath points dumps at the already-mounted, persistent
      # `sonarqube_logs` volume (default dump location is un-mounted
      # container-local disk, lost on recreate) for post-mortem debugging.
      #
      # Scale these up (and raise `deploy.resources.limits/reservations`
      # accordingly) if you start analyzing larger/more projects, increase
      # Compute Engine worker count, or see OOM kills in
      # `docker compose logs sonarqube` / `docker stats`.
      SONAR_WEB_JAVAOPTS: >-
        -Xmx512m -Xms256m
        -XX:+HeapDumpOnOutOfMemoryError -XX:+ExitOnOutOfMemoryError
        -XX:HeapDumpPath=/opt/sonarqube/logs/
      SONAR_CE_JAVAOPTS: >-
        -Xmx1G -Xms256m
        -XX:+HeapDumpOnOutOfMemoryError -XX:+ExitOnOutOfMemoryError
        -XX:HeapDumpPath=/opt/sonarqube/logs/
      SONAR_SEARCH_JAVAOPTS: >-
        -Xmx768m -Xms768m -XX:MaxDirectMemorySize=256m
        -XX:+HeapDumpOnOutOfMemoryError -XX:+ExitOnOutOfMemoryError
        -XX:HeapDumpPath=/opt/sonarqube/logs/
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    # The image also declares /opt/sonarqube/temp as a VOLUME (scratch space
    # for report processing / plugin extraction). Left unmapped, Docker
    # creates a fresh ANONYMOUS volume for it on every container recreate and
    # orphans the previous one -- a permanent, unbounded disk leak on the
    # shared Docker Desktop VM disk (confirmed via `docker system df -v`
    # after this stack's normal restarts). tmpfs is the right fix: temp data
    # doesn't need to survive a restart, so this keeps it in RAM instead of
    # ever touching disk, and it's cleared automatically on every restart.
    tmpfs:
      - /opt/sonarqube/temp:size=1g
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:9000/api/system/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4g
        reservations:
          # Lowered from 2g to match the JVM tuning above: idle steady-state
          # baseline is Web 256m + CE 256m + Search 768m (Xms) = ~1.3G, plus
          # per-process overhead -- 1.5g comfortably covers that without
          # reserving memory the tuned heaps no longer need at rest. The 4g
          # `limits.memory` above (the hard cap) is unchanged.
          memory: 1.5g
    restart: unless-stopped

  mcp:
    profiles: ["mcp"]
    # SonarQube Server's hosted MCP proxy (wired above via SONAR_MCP_*)
    # needs this companion server -- SonarQube exposes /mcp itself and
    # forwards requests to this container internally. AI agents (e.g.
    # Cursor) connect to http://localhost:9000/mcp, never to this service
    # directly -- it has no published port.
    #
    # MCP_VERSION must match the SonarQube Server version's compatible MCP
    # Server release -- see the compatibility table in
    # https://docs.sonarsource.com/sonarqube-mcp-server/setup/sonarqube-server-hosted
    image: sonarsource/sonarqube-mcp:${MCP_VERSION}
    depends_on:
      sonarqube:
        condition: service_healthy
    environment:
      STORAGE_PATH: /data
      SONARQUBE_URL: http://sonarqube:9000
      SONARQUBE_HTTP_HOST: 0.0.0.0
      SONARQUBE_HTTP_PORT: 8080
      SONARQUBE_TRANSPORT: http
    volumes:
      - mcp_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256m
    restart: unless-stopped

  sonarqube-prometheus-exporter:
    profiles: ["monitoring"]
    # Published from the separate rmrighes-sonar/sonarqube-prometheus-exporter repo's
    # CI (GitHub Actions -> GHCR) -- private image, needs a one-time
    # `docker login ghcr.io` on this machine (see README's Usage dashboard
    # section). Exports SonarQube project/portfolio business data (quality
    # gates, issues, coverage, ratings) as Prometheus metrics; SonarQube's
    # own native /api/monitoring/metrics endpoint (scraped directly by the
    # `prometheus` service below) doesn't cover that data.
    image: ghcr.io/rmrighes-sonar/sonarqube-prometheus-exporter:latest
    depends_on:
      sonarqube:
        condition: service_healthy
    environment:
      SONARQUBE_URL: http://sonarqube:9000
      # Same token/source-of-truth as before; now consumed here instead of
      # by Grafana's (removed) Infinity datasource.
      SONARQUBE_API_TOKEN: ${SONARQUBE_API_TOKEN}
    ports:
      - "127.0.0.1:9091:9091"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9091/metrics"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128m
    restart: unless-stopped

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:latest
    depends_on:
      sonarqube:
        condition: service_healthy
      sonarqube-prometheus-exporter:
        condition: service_healthy
      blackbox-exporter:
        condition: service_healthy
    secrets:
      - sonar_system_passcode
    # Replicates the image's default CMD and adds a size-based retention cap
    # so prometheus_data can't grow unbounded on the shared Docker Desktop
    # VM disk -- unset, Prometheus defaults to 15 days of *unbounded* size.
    # 512MB here means MiB (1024*1024 bytes) -- Prometheus's unit suffixes
    # are binary despite the decimal-looking names. Lowered from 1GB with
    # the actual prometheus_data volume sitting at ~50MB at the time, so
    # this cap change alone doesn't force Prometheus to delete anything;
    # it only takes effect (deleting oldest blocks first) if usage ever
    # grows past 512MB in the future.
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.size=512MB"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:latest
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Grafana's background installer re-checks ALL preinstalled plugins on
      # every startup -- including core-bundled ones like `prometheus` -- and
      # by default (preinstall_auto_update=true) deletes the working bundled
      # binary *before* fetching its replacement from
      # storage.googleapis.com. On networks that intercept/proxy that host,
      # the fetch then fails, leaving the plugin uninstalled until the next
      # successful startup -- so every `docker compose down && up`
      # permanently breaks the Server Health dashboard ("Could not find
      # plugin definition for data source" / "datasource not found") until
      # it happens to succeed. Disabling auto-update leaves an
      # already-installed bundled plugin alone; it still installs a plugin
      # fresh if truly missing (e.g. the first-ever startup, or right after
      # this exact failure mode -- see the Health dashboard troubleshooting
      # note in the README). No longer paired with GF_PLUGINS_PREINSTALL
      # (the Infinity datasource plugin it used to install has been removed
      # now that SonarQube's project/portfolio data comes through Prometheus
      # via sonarqube-prometheus-exporter instead) -- this setting still matters on its
      # own for the bundled `prometheus` plugin above.
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped

  ngrok:
    profiles: ["share"]
    image: ngrok/ngrok:latest
    depends_on:
      sonarqube:
        condition: service_healthy
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command: ["http", "--url=${NGROK_URL}", "http://sonarqube:9000"]
    ports:
      - "127.0.0.1:4040:4040"
    healthcheck:
      # The ngrok image has no curl/wget, only bash -- use /dev/tcp for a
      # TCP-level check against the local inspector API port.
      test: ["CMD-SHELL", "bash -c '(exec 3<>/dev/tcp/127.0.0.1/4040) 2>/dev/null'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128m
    restart: unless-stopped

  blackbox-exporter:
    profiles: ["monitoring"]
    # Probes mcp's /health endpoint and ngrok's local inspector API so their
    # reachability shows up in Prometheus/Grafana, since neither service
    # exposes its own Prometheus metrics.
    image: prom/blackbox-exporter:latest
    volumes:
      - ./prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9115/metrics"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64m
    restart: unless-stopped

volumes:
  postgres_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  prometheus_data:
  grafana_data:
  mcp_data:

secrets:
  # Sourced directly from the SONAR_SYSTEM_PASSCODE env var (set in .env) so
  # the passcode value has a single source of truth and never needs to be
  # written into a git-tracked config file (e.g. prometheus.yml).
  sonar_system_passcode:
    environment: SONAR_SYSTEM_PASSCODE
