name: sonarqube-local

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 256m
    restart: unless-stopped

  sonarqube:
    image: ${SONARQUBE_IMAGE}
    depends_on:
      db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SONAR_JDBC_USERNAME: ${POSTGRES_USER}
      SONAR_JDBC_PASSWORD: ${POSTGRES_PASSWORD}
      SONAR_WEB_SYSTEMPASSCODE: ${SONAR_SYSTEM_PASSCODE}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    # The image also declares /opt/sonarqube/temp as a VOLUME (scratch space
    # for report processing / plugin extraction). Left unmapped, Docker
    # creates a fresh ANONYMOUS volume for it on every container recreate and
    # orphans the previous one -- a permanent, unbounded disk leak on the
    # shared Docker Desktop VM disk (confirmed via `docker system df -v`
    # after this stack's normal restarts). tmpfs is the right fix: temp data
    # doesn't need to survive a restart, so this keeps it in RAM instead of
    # ever touching disk, and it's cleared automatically on every restart.
    tmpfs:
      - /opt/sonarqube/temp:size=1g
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:9000/api/system/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4g
        reservations:
          memory: 2g
    restart: unless-stopped

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:latest
    depends_on:
      sonarqube:
        condition: service_healthy
    secrets:
      - sonar_system_passcode
    # Replicates the image's default CMD and adds a size-based retention cap
    # so prometheus_data can't grow unbounded on the shared Docker Desktop
    # VM disk -- unset, Prometheus defaults to 15 days of *unbounded* size.
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.size=1GB"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:latest
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Installs asynchronously and does not block/fail Grafana startup if the
      # plugin catalog is briefly unreachable (unlike the deprecated,
      # startup-blocking GF_INSTALL_PLUGINS).
      GF_PLUGINS_PREINSTALL: yesoreyeram-infinity-datasource
      # Grafana's background installer re-checks ALL preinstalled plugins on
      # every startup -- including core-bundled ones like `prometheus` -- and
      # by default (preinstall_auto_update=true) deletes the working bundled
      # binary *before* fetching its replacement from
      # storage.googleapis.com. On networks that intercept/proxy that host
      # (see the Infinity plugin troubleshooting note below), the fetch then
      # fails, leaving the plugin uninstalled until the next successful
      # startup -- so every `docker compose down && up` permanently breaks
      # the Server Health dashboard ("Could not find plugin definition for
      # data source" / "datasource not found") until it happens to succeed.
      # Disabling auto-update leaves an already-installed bundled plugin
      # alone; it still installs a plugin fresh if truly missing (e.g. the
      # first-ever startup, or right after this exact failure mode -- see
      # the Health dashboard troubleshooting note in the README).
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      # Consumed via $__env{SONARQUBE_API_TOKEN} in
      # grafana/provisioning/datasources/sonarqube-api.yaml so the token has
      # a single source of truth in .env and is never written to a tracked file.
      SONARQUBE_API_TOKEN: ${SONARQUBE_API_TOKEN}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped

  ngrok:
    profiles: ["share"]
    image: ngrok/ngrok:latest
    depends_on:
      sonarqube:
        condition: service_healthy
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command: ["http", "--url=${NGROK_URL}", "http://sonarqube:9000"]
    ports:
      - "127.0.0.1:4040:4040"
    deploy:
      resources:
        limits:
          memory: 128m
    restart: unless-stopped

volumes:
  postgres_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  prometheus_data:
  grafana_data:

secrets:
  # Sourced directly from the SONAR_SYSTEM_PASSCODE env var (set in .env) so
  # the passcode value has a single source of truth and never needs to be
  # written into a git-tracked config file (e.g. prometheus.yml).
  sonar_system_passcode:
    environment: SONAR_SYSTEM_PASSCODE
