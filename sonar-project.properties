# See the "GitHub Integration" section of README.md for how this project is
# wired up to a SonarQube server.
sonar.projectKey=sonarqube-compose
sonar.projectName=sonarqube-compose

sonar.sources=.
# Exported Grafana dashboard JSON is generated/opaque, not hand-written
# source -- low signal for analysis. backups/ is gitignored and shouldn't
# exist in a checkout, but excluded here too for local scans.
sonar.exclusions=grafana/dashboards/**,backups/**
