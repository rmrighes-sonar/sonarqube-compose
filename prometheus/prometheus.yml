global:
  scrape_interval: 15s
scrape_configs:
  - job_name: sonarqube
    metrics_path: /api/monitoring/metrics
    authorization:
      credentials_file: /run/secrets/sonar_system_passcode
    static_configs:
      - targets: ["sonarqube:9000"]
  # Self-scrape so Grafana can chart Prometheus's own TSDB storage usage
  # (prometheus_tsdb_storage_blocks_bytes, prometheus_tsdb_retention_limit_bytes,
  # etc.) against the --storage.tsdb.retention.size cap set in compose.yaml.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  # sonarqube-prometheus-exporter (separate repo: rmrighes-sonar/sonarqube-prometheus-exporter)
  # covers project/portfolio business data (quality gates, issues, coverage,
  # ratings) that the `sonarqube` job above doesn't expose. A longer
  # scrape_interval than the 15s default: this data changes per-analysis,
  # not continuously, and each scrape costs SonarQube several Web API calls.
  - job_name: sonarqube-prometheus-exporter
    scrape_interval: 60s
    static_configs:
      - targets: ["sonarqube-prometheus-exporter:9091"]
  # blackbox-exporter probes for services with no Prometheus metrics of
  # their own -- mcp's HTTP /health endpoint and ngrok's local inspector
  # API (TCP-level check only, since ngrok's image has no HTTP client).
  # probe_success is 0 ("Down") when the mcp/share profiles aren't running
  # alongside monitoring -- same graceful-down behavior as the sonarqube job.
  - job_name: blackbox-mcp
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://mcp:8080/health"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
  - job_name: blackbox-ngrok
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ["ngrok:4040"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
